name: Dynamic UI Reliability

# Runs against a shared public practice site, so it is scheduled rather than tied to
# every push: a site outage should not read as a broken commit.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the suite
        run: mvn --batch-mode clean test

      - name: Upload the report, failure evidence and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            target/test-evidence
            logs
